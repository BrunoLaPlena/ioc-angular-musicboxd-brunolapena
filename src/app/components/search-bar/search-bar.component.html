<div class="search-bar-container">
  <label for="search">Search songs:</label>

  <!-- SEARCH FORM -->
  <form (ngSubmit)="onSearch(searchQuery)" class="search-form">
    <input
      id="search"
      type="text"
      placeholder="Name of song"
      [(ngModel)]="searchQuery"
      name="search"
      minlength="3"
      #searchInput="ngModel"
      aria-describedby="search-error"
      [attr.aria-invalid]="searchInput.invalid && searchInput.dirty"
      autocomplete="off"
    />

    <button type="submit" [disabled]="searchInput.invalid">Search</button>
  </form>

  <!-- POPULAR BUTTON-->
  <button type="button" class="popular-button" (click)="onPopularClick()">Click here to see the most popular songs</button>

  <!-- ERROR -->
  <div id="search-error" *ngIf="searchInput.invalid && searchInput.dirty">
    Minimum 3 characters required
  </div>
</div>
