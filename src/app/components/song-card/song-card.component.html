<div class="song-card">
  <h3>{{ song.title }}</h3>
  <h4>{{ song.artist }}</h4>

  <p *ngIf="variant === 'default'">{{ song.album }}</p>

  <button *ngIf="variant === 'default'" (click)="toggleFavorite()">
    {{ isFavorite ? "💜" : "🤍" }}
  </button>

  <div *ngIf="variant === 'favorites'" class="notes-section">
    <div *ngFor="let control of notesForm.controls; let i = index" class="note-row">
      <div style="flex: 1;">
        <input [formControl]="control" placeholder="Note..." />
        
        <small *ngIf="control.invalid && control.dirty">
          Minimum 3 characters
        </small>
      </div>
      
      <button (click)="removeNote(i)">✕</button>
    </div>

    <button class="add-note-btn" (click)="addNote()">+</button>
  </div>
</div>
