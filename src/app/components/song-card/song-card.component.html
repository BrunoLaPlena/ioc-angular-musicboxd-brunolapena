<div class="song-card">
  <h3>{{ song.title }}</h3>
  <h4>{{ song.artist }}</h4>

  <p *ngIf="variant === 'default'">{{ song.album }}</p>

  <button 
    *ngIf="variant === 'default'"
    (click)="toggleFavorite()"
  >
    {{ isFavorite ? '💜' : '🤍' }}
  </button>

  <div *ngIf="variant === 'favorites'">
    <div *ngFor="let control of notesForm.controls; let i = index">
      <input [formControl]="control" placeholder="Note..." />
    </div>

    <button (click)="addNote()">+</button>
  </div>
</div>
