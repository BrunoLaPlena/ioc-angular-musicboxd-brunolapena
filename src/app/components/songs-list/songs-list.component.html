<!-- LIST -->
<div class="grid" *ngIf="filteredSongs.length > 0; else noResults">
  <app-song-card
    *ngFor="let song of filteredSongs; trackBy: trackById"
    [song]="song"
  >
  </app-song-card>
</div>

<!-- EMPTY STATE -->
<ng-template #noResults>
  <div class="no-results">
    <p>No songs found</p>
    <small>Try another search</small>
  </div>
</ng-template>
