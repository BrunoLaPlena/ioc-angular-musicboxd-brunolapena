<!-- LIST -->
<div class="grid" *ngIf="songs.length > 0; else noResults">
  <app-song-card
    *ngFor="let song of songs; trackBy: trackById"
    [song]="song"
    [variant]="'default'"
  >
  </app-song-card>
</div>

<!-- EMPTY STATE -->
<ng-template #noResults>
  <div class="no-results">
    <p>No songs found</p>
    <small>Try another search</small>
  </div>
</ng-template>
